# نشر القائمة على Cloudflare Workers
# بعد إنشاء قاعدة D1 ومساحة KV استبدل المعرّفات أدناه (انظر README).

name = "digital-menu"
main = "worker/index.js"
compatibility_date = "2025-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
# كل الطلبات تمر عبر الـ Worker (لحقن SEO وحماية الرؤوس وخدمة الصور المرفوعة)
run_worker_first = true
# لا تُجرِ تحويلات تلقائية للملفات (.html) — المسارات تُحل داخل الـ Worker
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "digital-menu"
database_id = "b88cd1c8-5b41-4d7f-8957-be2d40dd3300"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "UPLOADS"
id = "b037f77002494bfc8445663f511da67b"

[observability]
enabled = true
