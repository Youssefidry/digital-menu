<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2410C">
<title>لا يوجد اتصال · قائمة الطعام</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--c:#C2410C;--ink:#1F1A17;--mut:#5C524A}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#FBF7F0;color:var(--ink);font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;text-align:center}
.card{max-width:420px;background:#fff;border:1px solid #EADCC8;border-radius:24px;padding:30px 24px;box-shadow:0 18px 40px rgba(31,26,23,.08)}
.ic{width:64px;height:64px;border-radius:20px;background:#FDF0E6;color:var(--c);display:grid;place-items:center;margin:0 auto 14px;font-size:30px}
h1{margin:0 0 8px;font-size:22px}
p{margin:0;color:var(--mut);line-height:1.8;font-size:14.5px}
button{margin-top:18px;min-height:48px;padding:0 26px;border:0;border-radius:14px;background:var(--c);color:#fff;font:inherit;font-weight:700;font-size:16px}
small{display:block;margin-top:14px;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="card">
  <div class="ic" aria-hidden="true">📡</div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>تحقق من اتصالك ثم أعد المحاولة. ستظهر القائمة المحفوظة إن كانت متوفرة على جهازك.</p>
  <button onclick="location.reload()">إعادة المحاولة</button>
  <small>القائمة تعمل دون اتصال بعد أول زيارة.</small>
</div>
</body>
</html>
